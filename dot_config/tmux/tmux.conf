# =============================================================================
# ENVIRONNEMENT & PERFORMANCE (Optimisé Helix & Fish)
# =============================================================================

# Fish comme shell par défaut
set -g default-command /usr/bin/fish

# Support du True Color (couleurs 24-bit) pour Helix et Oh My Posh
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:Tc"

# Suppression du délai de la touche Échap (Indispensable pour Helix)
set -sg escape-time 10

# Activer les événements de focus (Helix en a besoin)
set -g focus-events on

# Historique généreux
set -g history-limit 10000

# =============================================================================
# ERGONOMIE & RACCOURCIS
# =============================================================================

# Préfixe : Ctrl + q
unbind C-b
set-option -g prefix C-q
bind-key C-q send-prefix

# Splits verticaux (|) et horizontaux (-) dans le dossier actuel
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Recharger la config avec un message visuel
bind r source-file ~/.config/tmux/tmux.conf \; display " Config Helix-Tmux rechargée !"

# Navigation entre panneaux (Alt + Flèches)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Activer la souris et bloquer le renommage automatique
set -g mouse on
set-option -g allow-rename off

# Indexation des fenêtres à 1 (plus ergonomique)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# =============================================================================
# DESIGN DE LA BARRE DE STATUT (Style "Pills" Avancé)
# =============================================================================

# Positionner la barre en bas
set -g status-position bottom

# Fond transparent pour la barre principale (s'adapte au fond de ton terminal)
set -g status-style 'bg=default fg=#c0caf5'

# --- SECTION GAUCHE : La Session ---
# Capsule bleue pour le nom de la session tmux
set -g status-left '#[fg=#7aa2f7,bg=default]#[fg=#1a1b26,bg=#7aa2f7,bold]󰘧 #S #[fg=#7aa2f7,bg=default] '
set -g status-left-length 30

# --- SECTION CENTRALE : Les Fenêtres ---
# Alignement au centre pour un look équilibré
set -g status-justify centre

# --- SECTION DROITE : Alerte Préfixe ---
set -g status-right '#{?client_prefix,#[fg=#f7768e]#[bg=default]#[fg=#1a1b26]#[bg=#f7768e]#[bold]󱊗 WAIT#[fg=#f7768e]#[bg=default],}'
set -g status-right-length 20

# Fenêtre inactive : Simple, discrète
setw -g window-status-format '#[fg=#565f89,bg=default] #I:#W '

# Fenêtre active : Capsule Magenta qui pop !
setw -g window-status-current-format '#[fg=#bb9af7,bg=default]#[fg=#1a1b26,bg=#bb9af7,bold]󰖯 #I:#W#[fg=#bb9af7,bg=default]'

# --- BORDURES DES PANNEAUX ---
set -g pane-border-style 'fg=#3b4261'
set -g pane-active-border-style 'fg=#7aa2f7'
