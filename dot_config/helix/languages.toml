### Disable Terraform LSP for Terragrunt

[[language]]
name = "hcl"
file-types = ["hcl", "nomad"]
language-servers = []

[[language]]
name = "tfvars"
file-types = ["tf", "tfvars"]

### Python
[[language]]
name = "python"
language-servers = ["pyright", "ruff"]
auto-format = true
[language-server.pyright.config.python.analysis]
typeCheckingMode = "basic"
[language-server.ruff]
command = "ruff"
args = ["server"]
